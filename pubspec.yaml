name: spoonary_client_care_service
description: "스푸너리 공식 고객 도우미 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/font/pretendard/Pretendard-Thin.otf
          weight: 100
        - asset: assets/font/pretendard/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/font/pretendard/Pretendard-Light.otf
          weight: 300
        - asset: assets/font/pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: assets/font/pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/font/pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/font/pretendard/Pretendard-Bold.otf
          weight: 700
        - asset: assets/font/pretendard/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/font/pretendard/Pretendard-Black.otf
          weight: 900
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
